<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --bg: #0a0e1a;
    --bg-elev: #131829;
    --bg-card: #1a2038;
    --border: #252b45;
    --text: #e8ecf5;
    --text-dim: #8892b0;
    --accent: #00d4aa;
    --accent-warm: #ffb800;
    --have: #00d4aa;
    --dup: #ffb800;
    --missing: #2a3050;
    --danger: #ff4757;
    --shadow: 0 4px 20px rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(0,212,170,0.08) 0%, transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(255,184,0,0.06) 0%, transparent 45%);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 60px;
  }

  header {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }

  .header-inner {
    max-width: 1400px;
    margin: 0 auto;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(24px, 5vw, 40px);
    letter-spacing: 1.5px;
    line-height: 1;
    margin-bottom: 2px;
  }

  h1 span {
    color: var(--accent);
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 11px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    font-weight: 500;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-top: 14px;
  }

  .stat {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    position: relative;
    overflow: hidden;
  }

  .stat-label {
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 4px;
    font-weight: 600;
  }

  .stat-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
  }

  .stat.have .stat-value { color: var(--have); }
  .stat.dup .stat-value { color: var(--dup); }
  .stat.pct .stat-value { color: var(--accent); }

  .progress-bar {
    height: 3px;
    background: var(--missing);
    border-radius: 2px;
    margin-top: 6px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-warm));
    transition: width 0.4s ease;
  }

  .controls {
    max-width: 1400px;
    margin: 14px auto 0;
    padding: 0 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  .search-box {
    flex: 1;
    min-width: 180px;
    position: relative;
  }

  .search-box input {
    width: 100%;
    padding: 10px 12px 10px 36px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    text-transform: uppercase;
    transition: border-color 0.2s;
  }

  .search-box input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .search-box::before {
    content: '⌕';
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    font-size: 16px;
  }

  select, .btn {
    padding: 10px 14px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }

  select:hover, .btn:hover {
    border-color: var(--accent);
  }

  .btn.primary {
    background: var(--accent);
    color: #0a0e1a;
    border-color: var(--accent);
    font-weight: 600;
  }

  .btn.primary:hover {
    background: #00f0c0;
  }

  .btn.danger:hover {
    border-color: var(--danger);
    color: var(--danger);
  }

  main {
    max-width: 1400px;
    margin: 18px auto 0;

<script>
// ============= DADOS DAS FIGURINHAS =============
const ALBUM = [
  { code: 'FWC', name: 'Abertura / FIFA World Cup', count: 20, range: [0, 19] },
  { code: 'MEX', name: 'México', count: 20 },
  { code: 'RSA', name: 'África do Sul', count: 20 },
  { code: 'KOR', name: 'Coreia do Sul', count: 20 },
  { code: 'CZE', name: 'República Tcheca', count: 20 },
  { code: 'CAN', name: 'Canadá', count: 20 },
  { code: 'BIH', name: 'Bósnia e Herzegovina', count: 20 },
  { code: 'QAT', name: 'Catar', count: 20 },
  { code: 'SUI', name: 'Suíça', count: 20 },
  { code: 'BRA', name: 'Brasil', count: 20 },
  { code: 'MAR', name: 'Marrocos', count: 20 },
  { code: 'HAI', name: 'Haiti', count: 20 },
  { code: 'SCO', name: 'Escócia', count: 20, prefix3: true },
  { code: 'USA', name: 'Estados Unidos', count: 20 },
  { code: 'PAR', name: 'Paraguai', count: 20 },
  { code: 'AUS', name: 'Austrália', count: 20 },
  { code: 'TUR', name: 'Turquia', count: 20 },
  { code: 'GER', name: 'Alemanha', count: 20 },
  { code: 'CUW', name: 'Curaçao', count: 20 },
  { code: 'CIV', name: 'Costa do Marfim', count: 20 },
  { code: 'ECU', name: 'Equador', count: 20 },
  { code: 'NED', name: 'Holanda', count: 20 },
  { code: 'JPN', name: 'Japão', count: 20 },
  { code: 'SWE', name: 'Suécia', count: 20 },
  { code: 'TUN', name: 'Tunísia', count: 20 },
  { code: 'BEL', name: 'Bélgica', count: 20 },
  { code: 'EGY', name: 'Egito', count: 20 },
  { code: 'IRN', name: 'Irã', count: 20 },
  { code: 'NZL', name: 'Nova Zelândia', count: 20 },
  { code: 'ESP', name: 'Espanha', count: 20 },
  { code: 'CPV', name: 'Cabo Verde', count: 20 },
  { code: 'KSA', name: 'Arábia Saudita', count: 20 },
  { code: 'URU', name: 'Uruguai', count: 20 },
  { code: 'FRA', name: 'França', count: 20 },
  { code: 'SEN', name: 'Senegal', count: 20 },
  { code: 'IRQ', name: 'Iraque', count: 20 },
  { code: 'NOR', name: 'Noruega', count: 20 },
  { code: 'ARG', name: 'Argentina', count: 20 },
  { code: 'ALG', name: 'Argélia', count: 20 },
  { code: 'AUT', name: 'Áustria', count: 20 },
  { code: 'JOR', name: 'Jordânia', count: 20 },
  { code: 'POR', name: 'Portugal', count: 20 },
  { code: 'COD', name: 'Rep. Dem. Congo', count: 20 },
  { code: 'UZB', name: 'Uzbequistão', count: 20 },
  { code: 'COL', name: 'Colômbia', count: 20 },
  { code: 'ENG', name: 'Inglaterra', count: 20 },
  { code: 'CRO', name: 'Croácia', count: 20 },
  { code: 'GHA', name: 'Gana', count: 20 },
  { code: 'PAN', name: 'Panamá', count: 20 },
  { code: 'CC',  name: 'Cromos especiais', count: 14 }
];

// Gera todos os códigos das figurinhas
function generateCodes() {
  const all = [];
  ALBUM.forEach(team => {
    const start = team.range ? team.range[0] : 1;
    const end = team.range ? team.range[1] : team.count;
    for (let i = start; i <= end; i++) {
      let code;
      if (team.prefix3) {
        // SCO usa 3 dígitos: SCO001-SCO020
        code = team.code + String(i).padStart(3, '0');
      } else {
        code = team.code + String(i).padStart(2, '0');
      }
      all.push({ code, team: team.code, teamName: team.name });
    }
  });
  return all;
}

const ALL_STICKERS = generateCodes();
const STORAGE_KEY = 'album-copa-2026-v1';

// Estado: { 'BRA01': 0 } onde 0=não tenho, 1=tenho, 2+=repetidas (1 + N extras)
let state = {};

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) state = JSON.parse(saved);
  } catch(e) { state = {}; }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e) {
    showToast('Erro ao salvar', true);
  }
}

function getStatus(code) {
  const v = state[code] || 0;
  if (v === 0) return 'missing';
  if (v === 1) return 'have';
  return 'dup';
}

function cycleSticker(code) {
  const v = state[code] || 0;
  if (v === 0) state[code] = 1;
  else if (v === 1) state[code] = 2;
  else delete state[code];
  saveState();
  render();
}

function incrementDup(code) {
  const v = state[code] || 0;
  if (v >= 1) {
    state[code] = v + 1;
    saveState();
    render();
  }
}

function decrementDup(code) {
  const v = state[code] || 0;
  if (v > 1) {
    state[code] = v - 1;
    saveState();
    render();
  }
}

// ============= RENDERIZAÇÃO =============
const main = document.getElementById('main');
const searchInput = document.getElementById('search');
const filterTeam = document.getElementById('filter-team');
const filterStatus = document.getElementById('filter-status');

// Popular dropdown de seleções
ALBUM.forEach(t => {
  const opt = document.createElement('option');
  opt.value = t.code;
  opt.textContent = t.name;
  filterTeam.appendChild(opt);
});

function render() {
  const q = searchInput.value.trim().toUpperCase();
  const ft = filterTeam.value;
  const fs = filterStatus.value;

  // Stats
  let have = 0, dup = 0, total = ALL_STICKERS.length;
  ALL_STICKERS.forEach(s => {
    const v = state[s.code] || 0;
    if (v >= 1) have++;
    if (v >= 2) dup += (v - 1);
  });
  const missing = total - have;
  const pct = total > 0 ? Math.round((have / total) * 100) : 0;

  document.getElementById('stat-have').textContent = have;
  document.getElementById('stat-dup').textContent = dup;
  document.getElementById('stat-missing').textContent = missing;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-pct').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';

  // Render por seleção
  main.innerHTML = '';

  ALBUM.forEach(team => {
    if (ft && ft !== team.code) return;

    const teamStickers = ALL_STICKERS.filter(s => s.team === team.code);
    const visibleStickers = teamStickers.filter(s => {
      if (q && !s.code.includes(q)) return false;
      if (fs && getStatus(s.code) !== fs) return false;
      return true;
    });

    if (visibleStickers.length === 0) return;

    const teamHave = teamStickers.filter(s => (state[s.code] || 0) >= 1).length;
    const teamPct = Math.round((teamHave / teamStickers.length) * 100);
    const isComplete = teamHave === teamStickers.length;

    const section = document.createElement('section');
    section.className = 'team-section' + (isComplete ? ' complete' : '');

    section.innerHTML = `
      <div class="team-header">
        <div class="team-name">${team.name} ${isComplete ? '✓' : ''}</div>
        <div class="team-progress">
          <span>${teamHave}/${teamStickers.length}</span>
          <div class="team-progress-bar"><div class="team-progress-fill" style="width:${teamPct}%"></div></div>
          <span>${teamPct}%</span>
          <span class="toggle-icon">▼</span>
        </div>
      </div>
      <div class="stickers-grid"></div>
    `;

    const grid = section.querySelector('.stickers-grid');
    visibleStickers.forEach(s => {
      const status = getStatus(s.code);
      const v = state[s.code] || 0;
      const div = document.createElement('div');
      div.className = 'sticker ' + status;
      div.dataset.code = s.code;

      let label = '';
      if (status === 'have') label = '✓ tenho';
      else if (status === 'dup') label = `+${v - 1} repetida${v - 1 > 1 ? 's' : ''}`;

      div.innerHTML = `
        <div class="code">${s.code}</div>
        <div class="label">${label}</div>
        ${status === 'dup' ? `
          <div class="dup-count">${v - 1}</div>
          <div class="dup-controls">
            <button class="dup-btn dup-minus" aria-label="Diminuir">−</button>
            <button class="dup-btn dup-plus" aria-label="Aumentar">+</button>
          </div>
        ` : ''}
      `;

      // Botões +/- (clicar neles não deve propagar para a figurinha)
      const plusBtn = div.querySelector('.dup-plus');
      const minusBtn = div.querySelector('.dup-minus');
      if (plusBtn) {
        plusBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          incrementDup(s.code);
        });
      }
      if (minusBtn) {
        minusBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          decrementDup(s.code);
        });
      }

      div.addEventListener('click', () => cycleSticker(s.code));
      div.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        if (getStatus(s.code) === 'dup') incrementDup(s.code);
        else if (getStatus(s.code) === 'have') {
          state[s.code] = 2;
          saveState();
          render();
        }
      });

      // Shift+clique para diminuir
      div.addEventListener('auxclick', (e) => {
        if (e.button === 1) {
          e.preventDefault();
          decrementDup(s.code);
        }
      });

      grid.appendChild(div);
    });

    // Toggle de seção
    section.querySelector('.team-header').addEventListener('click', (e) => {
      if (e.target.closest('.sticker')) return;
      section.classList.toggle('collapsed');
    });

    main.appendChild(section);
  });

  if (main.children.length === 0) {
    main.innerHTML = '<div class="empty-state">Nenhuma figurinha encontrada com esses filtros.</div>';
  }
}

const modal = document.getElementById('modal');
document.getElementById('btn-trade').addEventListener('click', () => {
  const tradeContent = document.getElementById('trade-content');

  const dups = [];
  ALL_STICKERS.forEach(s => {
    const v = state[s.code] || 0;
    if (v >= 2) {
      dups.push({ code: s.code, count: v - 1, team: s.teamName });
    }
  });

  const missingByTeam = {};
  ALL_STICKERS.forEach(s => {
    if ((state[s.code] || 0) === 0) {
      if (!missingByTeam[s.teamName]) missingByTeam[s.teamName] = [];
      missingByTeam[s.teamName].push(s.code);
    }
  });

  let html = '';

  if (dups.length === 0 && Object.keys(missingByTeam).length === 0) {
    html = '<div class="empty-state">Álbum completo! 🏆</div>';
  } else {
    html += '<h3 style="font-family:Bebas Neue;letter-spacing:1.5px;font-size:18px;margin-bottom:10px;color:var(--dup);">REPETIDAS (' + dups.reduce((s,d)=>s+d.count,0) + ')</h3>';
    if (dups.length === 0) {
      html += '<div class="trade-list" style="color:var(--text-dim);">Nenhuma repetida.</div>';
    } else {
      const dupText = dups.map(d => d.code + (d.count > 1 ? ' x' + d.count : '')).join(', ');
      html += '<div class="trade-list" id="dup-text">' + dupText + '</div>';
    }

    html += '<h3 style="font-family:Bebas Neue;letter-spacing:1.5px;font-size:18px;margin:20px 0 10px;color:var(--accent);">FALTAM</h3>';
    const missCount = Object.values(missingByTeam).reduce((s,a)=>s+a.length,0);
    if (missCount === 0) {
      html += '<div class="trade-list" style="color:var(--have);">Você tem todas as figurinhas! 🎉</div>';
    } else {
      let missHtml = '';
      Object.keys(missingByTeam).forEach(team => {
        missHtml += team + ': ' + missingByTeam[team].join(', ') + '\n\n';
      });
      html += '<div class="trade-list" id="miss-text">' + missHtml.trim() + '</div>';
    }
  }

  tradeContent.innerHTML = html;
  modal.classList.add('show');
});

// Função para construir HTML estilizado para a imagem do "Faltam"
function buildShareImageHTML() {
  let totalHave = 0, totalDups = 0, totalMissing = 0;
  ALL_STICKERS.forEach(s => {
    const v = state[s.code] || 0;
    if (v >= 1) totalHave++; else totalMissing++;
    if (v >= 2) totalDups += (v - 1);
  });
  const pct = Math.round((totalHave / ALL_STICKERS.length) * 100);

  // Separar seleções em 3 grupos:
  // 1) Em progresso (tem algumas mas faltam outras) - mostradas em destaque
  // 2) Não iniciadas (todas faltam) - listadas compactas no final
  // 3) Completas - não mostradas
  const inProgress = [];
  const notStarted = [];

  ALBUM.forEach(team => {
    const teamStickers = ALL_STICKERS.filter(s => s.team === team.code);
    const have = teamStickers.filter(s => (state[s.code] || 0) >= 1).length;
    const missing = teamStickers.filter(s => (state[s.code] || 0) === 0);
    if (missing.length === 0) return; // completa, pula
    if (have === 0) {
      notStarted.push({ name: team.name, prefix: team.code, total: teamStickers.length });
    } else {
      inProgress.push({
        name: team.name,
        prefix: team.code,
        count: missing.length,
        total: teamStickers.length,
        nums: missing.map(s => parseInt(s.code.replace(/^[A-Z]+/, ''), 10).toString())
      });
    }
  });

  // Ordenar "em progresso" por quantas faltam (menos faltando = mais perto de completar = primeiro)
  inProgress.sort((a, b) => a.count - b.count);

  let progressHtml = '';
  inProgress.forEach(info => {
    progressHtml += `
      <div class="img-team">
        <div class="img-team-code">${info.prefix}</div>
        <div class="img-nums">
          ${info.nums.map(n => `<span class="img-num">${n}</span>`).join('')}
        </div>
      </div>
    `;
  });

  let notStartedHtml = '';
  if (notStarted.length > 0) {
    notStartedHtml = `
      <div class="img-not-started">
        <div class="img-not-started-title">⚠️ Ainda não comecei estas (qualquer figurinha ajuda):</div>
        <div class="img-not-started-list">
          ${notStarted.map(t => `<span class="img-team-pill">${t.prefix}</span>`).join('')}
        </div>
      </div>
    `;
  }

  let mainContent = '';
  if (inProgress.length === 0 && notStarted.length === 0) {
    mainContent = `
      <div class="img-complete">
        <div class="img-trophy">🏆</div>
        <div class="img-complete-text">ÁLBUM COMPLETO!</div>
      </div>
    `;
  } else {
    mainContent = `
      ${inProgress.length > 0 ? `
        <div class="img-section-title">
          <span>🎯</span> Estou quase completando estas
        </div>
        <div class="img-teams-grid">
          ${progressHtml}
        </div>
      ` : ''}
      ${notStartedHtml}
    `;
  }

  return `
    <div class="img-card">
      <div class="img-bg-pattern"></div>
      <div class="img-content">
        <div class="img-header">
          <div class="img-title">
            <div class="img-album">ÁLBUM</div>
            <div class="img-cup">COPA 2026</div>
          </div>
          <div class="img-badge">
            <div class="img-pct">${pct}%</div>
            <div class="img-pct-label">completo</div>
          </div>
        </div>

        <div class="img-stats-row">
          <div class="img-stat">
            <div class="img-stat-value have">${totalHave}</div>
            <div class="img-stat-label">coladas</div>
          </div>
          <div class="img-stat">
            <div class="img-stat-value dup">${totalDups}</div>
            <div class="img-stat-label">repetidas</div>
          </div>
          <div class="img-stat">
            <div class="img-stat-value miss">${totalMissing}</div>
            <div class="img-stat-label">faltam</div>
          </div>
        </div>

        <div class="img-progress">
          <div class="img-progress-fill" style="width:${pct}%"></div>
        </div>

        ${mainContent}

        <div class="img-footer">
          PANINI · FIFA WORLD CUP 2026
        </div>
      </div>
    </div>
  `;
}

// Gerar e compartilhar imagem
document.getElementById('share-image').addEventListener('click', async () => {
  showToast('Gerando imagem...');
  shareModal.classList.remove('show');

  // Construir conteúdo
  const container = document.getElementById('image-container');
  container.innerHTML = imageStyles + buildShareImageHTML();

  // Aguardar fontes carregarem
  await new Promise(r => setTimeout(r, 300));
  if (document.fonts && document.fonts.ready) {
    await document.fonts.ready;
  }

  try {
    const cardEl = container.querySelector('.img-card');
    const canvas = await html2canvas(cardEl, {
      backgroundColor: '#0a0e1a',
      scale: 1.5,
      logging: false,
      useCORS: true,
      allowTaint: true
    });

    canvas.toBlob(async (blob) => {
      if (!blob) {
        showToast('Erro ao gerar imagem', true);
        return;
      }

      const file = new File([blob], 'album-copa-2026.png', { type: 'image/png' });

      // Tentar usar Web Share API (compartilhar nativo - WhatsApp, etc)
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: 'Álbum Copa 2026',
            text: 'Meu progresso no álbum da Copa 2026! Quem tem essas pra trocar?'
          });
          showToast('Compartilhado!');
        } catch (e) {
          if (e.name !== 'AbortError') {
            // Fallback: download
            downloadImage(blob);
          }
        }
      } else {
        // Fallback: download da imagem
        downloadImage(blob);
      }

      // Limpar container
      container.innerHTML = '';
    }, 'image/png');
  } catch (e) {
    console.error(e);
    showToast('Erro ao gerar imagem', true);
    container.innerHTML = '';
  }
});

function downloadImage(blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'album-copa-2026.png';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast('Imagem baixada! Compartilhe pelo WhatsApp');
}

// Compartilhar texto das repetidas
document.getElementById('share-text').addEventListener('click', async () => {
  // Coletar repetidas agrupadas por seleção
  const dupsByTeam = {};
  ALBUM.forEach(team => {
    const teamStickers = ALL_STICKERS.filter(s => s.team === team.code);
    const dups = [];
    teamStickers.forEach(s => {
      const v = state[s.code] || 0;
      if (v >= 2) {
        const num = parseInt(s.code.replace(/^[A-Z]+/, ''), 10).toString();
        dups.push(num + (v > 2 ? '×' + (v-1) : ''));
      }
    });
    if (dups.length > 0) {
      dupsByTeam[team.name] = { prefix: team.code, nums: dups };
    }
  });

  let totalDups = 0;
  ALL_STICKERS.forEach(s => {
    const v = state[s.code] || 0;
    if (v >= 2) totalDups += (v - 1);
  });

  let text = '🏆 *ÁLBUM COPA 2026* 🏆\n';
  text += '_Tenho essas repetidas pra trocar:_\n\n';

  if (Object.keys(dupsByTeam).length === 0) {
    text += 'Nenhuma repetida no momento 😅';
  } else {
    Object.keys(dupsByTeam).forEach(teamName => {
      const info = dupsByTeam[teamName];
      text += `⚽ *${teamName}* (${info.prefix}): ${info.nums.join(', ')}\n`;
    });
    text += `\n📊 Total: *${totalDups} figurinhas* repetidas`;
  }

  text += '\n\nQuem tem alguma das que tô precisando? 🙏';

  shareModal.classList.remove('show');

  // Tentar compartilhamento nativo
  if (navigator.share) {
    try {
      await navigator.share({
        title: 'Álbum Copa 2026 - Repetidas',
        text: text
      });
      showToast('Compartilhado!');
      return;
    } catch (e) {
      if (e.name === 'AbortError') return;
    }
  }

  // Fallback: copiar para área de transferência
  try {
    await navigator.clipboard.writeText(text);
    showToast('Texto copiado! Cole no WhatsApp');
  } catch (e) {
    showToast('Erro ao copiar texto', true);
  }
});

// Botão instalar
const installBtn = document.getElementById('install-btn');
if (installBtn) {
  installBtn.addEventListener('click', async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        showToast('App instalado!');
        installBtn.style.display = 'none';
      }
      deferredPrompt = null;
    } else {
      showToast('Use "Adicionar à tela inicial" no menu do navegador');
    }
  });
}

// ============= INIT =============
loadState();
render();
</script>


<script>
// Service Worker inline para funcionamento offline
if ('serviceWorker' in navigator) {
  const swCode = `
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => self.clients.claim());
    self.addEventListener('fetch', e => {
      e.respondWith(
        caches.open('copa2026-v1').then(cache =>
          cache.match(e.request).then(r => r || fetch(e.request).then(resp => {
            if (resp.ok) cache.put(e.request, resp.clone());
            return resp;
          }).catch(() => cache.match('/')))
        )
      );
    });
  `;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(() => {});
}

// Detectar instalação
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const installBtn = document.getElementById('install-btn');
  if (installBtn) installBtn.style.display = 'inline-flex';
});
</script>
